<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 to GY-MCU90640 UART wiring</title>
  <desc id="desc">Connection diagram showing GY-MCU90640 TX to ESP32 GPIO16 RX2, GY-MCU90640 RX to ESP32 GPIO17 TX2, common ground, and module-rated VCC.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #111827; stroke: #94a3b8; stroke-width: 2; }
      .title { fill: #f8fafc; font: 700 26px Arial, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 16px Arial, sans-serif; }
      .device { fill: #f8fafc; font: 700 28px Arial, sans-serif; }
      .deviceSub { fill: #cbd5e1; font: 16px Arial, sans-serif; }
      .pin { fill: #1f2937; stroke: #64748b; stroke-width: 1.5; }
      .pintext { fill: #e5e7eb; font: 700 16px Consolas, monospace; }
      .note { fill: #cbd5e1; font: 15px Arial, sans-serif; }
      .wire-rx { stroke: #38bdf8; stroke-width: 5; fill: none; marker-end: url(#arrowBlue); }
      .wire-tx { stroke: #fb7185; stroke-width: 5; fill: none; marker-end: url(#arrowRed); }
      .wire-gnd { stroke: #a3a3a3; stroke-width: 5; fill: none; }
      .wire-vcc { stroke: #facc15; stroke-width: 5; fill: none; }
      .labelBox { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .label { fill: #f8fafc; font: 700 15px Arial, sans-serif; }
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fb7185" />
    </marker>
  </defs>

  <rect class="bg" width="980" height="520" />
  <text class="title" x="490" y="48" text-anchor="middle">Thermal camera wiring used in this project</text>
  <text class="subtitle" x="490" y="78" text-anchor="middle">GPIO16/GPIO17 are the pins used here. You can change them in the Arduino sketch.</text>

  <rect class="card" x="70" y="120" width="300" height="305" rx="18" />
  <text class="device" x="220" y="160" text-anchor="middle">GY-MCU90640</text>
  <text class="deviceSub" x="220" y="188" text-anchor="middle">UART thermal camera</text>

  <rect class="pin" x="245" y="220" width="90" height="34" rx="8" />
  <text class="pintext" x="290" y="242" text-anchor="middle">TX</text>
  <rect class="pin" x="245" y="270" width="90" height="34" rx="8" />
  <text class="pintext" x="290" y="292" text-anchor="middle">RX</text>
  <rect class="pin" x="245" y="320" width="90" height="34" rx="8" />
  <text class="pintext" x="290" y="342" text-anchor="middle">GND</text>
  <rect class="pin" x="245" y="370" width="90" height="34" rx="8" />
  <text class="pintext" x="290" y="392" text-anchor="middle">VCC</text>

  <rect class="card" x="610" y="120" width="300" height="305" rx="18" />
  <text class="device" x="760" y="160" text-anchor="middle">ESP32</text>
  <text class="deviceSub" x="760" y="188" text-anchor="middle">Arduino bridge</text>

  <rect class="pin" x="645" y="220" width="145" height="34" rx="8" />
  <text class="pintext" x="717" y="242" text-anchor="middle">GPIO16 RX2</text>
  <rect class="pin" x="645" y="270" width="145" height="34" rx="8" />
  <text class="pintext" x="717" y="292" text-anchor="middle">GPIO17 TX2</text>
  <rect class="pin" x="645" y="320" width="145" height="34" rx="8" />
  <text class="pintext" x="717" y="342" text-anchor="middle">GND</text>
  <rect class="pin" x="645" y="370" width="145" height="34" rx="8" />
  <text class="pintext" x="717" y="392" text-anchor="middle">VCC / 3.3V*</text>

  <path class="wire-rx" d="M335 237 H645" />
  <rect class="labelBox" x="405" y="207" width="170" height="24" rx="6" />
  <text class="label" x="490" y="224" text-anchor="middle">sensor TX → ESP32 RX</text>

  <path class="wire-tx" d="M645 287 H335" />
  <rect class="labelBox" x="405" y="257" width="170" height="24" rx="6" />
  <text class="label" x="490" y="274" text-anchor="middle">ESP32 TX → sensor RX</text>

  <path class="wire-gnd" d="M335 337 H645" />
  <rect class="labelBox" x="421" y="307" width="138" height="24" rx="6" />
  <text class="label" x="490" y="324" text-anchor="middle">common ground</text>

  <path class="wire-vcc" d="M335 387 H645" />
  <rect class="labelBox" x="400" y="357" width="180" height="24" rx="6" />
  <text class="label" x="490" y="374" text-anchor="middle">module-rated supply</text>

  <text class="note" x="490" y="445" text-anchor="middle">Default code constants: SENSOR_RX_PIN = 16, SENSOR_TX_PIN = 17</text>
  <text class="note" x="490" y="470" text-anchor="middle">*Use the voltage required by your camera module. Many breakout boards use 3.3 V, but check your module label/datasheet.</text>
</svg>
